<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C# Midterm · Top 70</title>
<style>
:root{--bg:#1a1d24;--p:#222733;--p2:#2b3142;--ink:#dfe4f0;--mut:#8d96ad;--ln:#353d52;--ac:#7aa2f7;--ok:#5fd3a8;--no:#ff7b8a;--code:#13161c;--l1:#6cb6ff;--l2:#b392f0;--l3:#5fd3a8;--l4:#ffb86b;--l5:#ff8fa3;--kw:#c586c0;--ty:#4ec9b0;--st:#ce9178;--nu:#b5cea8;--cm:#6a9955;--sb:#3b4a7a;--mono:"JetBrains Mono","Cascadia Code",Consolas,Menlo,monospace;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t=light]{--bg:#f5f3ec;--p:#fffdf8;--p2:#efece2;--ink:#232733;--mut:#666d82;--ln:#dcd8c9;--ac:#2f5fd0;--ok:#0f8a62;--no:#cf3a50;--code:#faf8f1;--l1:#1f6fd1;--l2:#7a4fd6;--l3:#0f8a62;--l4:#c26a0a;--l5:#d03a5c;--kw:#9b3fb5;--ty:#0f7e73;--st:#b0512a;--nu:#2e7d32;--cm:#6f8f58;--sb:#2f5fd0;color-scheme:light}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.75 system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--p);z-index:20}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:19;direction:ltr;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--p);border-bottom:1px solid var(--ln)}
.br{font:700 15px var(--mono);color:var(--ac)}.br i{color:var(--kw);font-style:normal}.br span{color:var(--mut)}
.tl{display:flex;gap:6px;align-items:center}
.seg{display:flex;border:1px solid var(--ln);border-radius:7px;overflow:hidden}
.seg button,#th{background:none;border:0;padding:4px 10px;font:700 12px var(--mono);color:var(--mut)}
#th{border:1px solid var(--ln);border-radius:7px}
.seg .on{background:var(--ac);color:var(--bg)}
main{max-width:760px;margin:auto;padding:14px 14px 84px}
.hero{direction:ltr;background:var(--code);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;font:600 13px/1.7 var(--mono);overflow-x:auto;white-space:pre}
.hero .c{color:var(--cm)}.hero .k{color:var(--kw)}.hero .t{color:var(--ty)}.hero .s{color:var(--st)}
.hero u{display:inline-block;width:.55em;height:1.05em;background:var(--ac);vertical-align:-.2em;animation:b 1.1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.hero u{animation:none}}
.chs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px;direction:ltr}
.ch{flex:none;display:flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--ln);border-radius:8px 8px 0 0;border-bottom:3px solid var(--c,var(--ln));background:var(--p);font:700 12px var(--mono);color:var(--mut)}
.ch i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--mut))}
.ch small{opacity:.7}
.ch.on{background:var(--p2);color:var(--ink)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(24px,1fr));gap:4px;margin:10px 0 14px;direction:ltr}
.mp{aspect-ratio:1;border-radius:5px;border:1.5px solid var(--c);background:transparent;font:600 9px var(--mono);color:var(--mut);padding:0}
.mp.ok{background:var(--ok);color:var(--bg);border-color:var(--ok)}.mp.no{background:var(--no);color:var(--bg);border-color:var(--no)}
.mp.cur{outline:2px solid var(--ink);outline-offset:1px}
.card{background:var(--p);border:1px solid var(--ln);border-inline-start:5px solid var(--c);border-radius:12px;padding:14px 16px 16px;margin:0 0 14px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:700 12px var(--mono)}
.lc{color:var(--c)}.num{margin-inline-start:auto;color:var(--mut)}
.chip{border:1px solid var(--ln);border-radius:5px;padding:0 7px;color:var(--mut)}
.qt{direction:ltr;text-align:left;margin:10px 0;font:700 17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
pre{direction:ltr;text-align:left;background:var(--code);border:1px solid var(--ln);border-radius:8px;padding:10px 0;overflow-x:auto;font:13px/1.65 var(--mono);margin:10px 0;counter-reset:n}
pre span{display:block;padding-right:12px;white-space:pre}
pre span::before{counter-increment:n;content:counter(n);display:inline-block;width:2.4em;margin-right:10px;text-align:right;color:var(--mut);opacity:.7}
pre.out span::before{content:none}pre.out span{padding-left:14px}
pre i{font-style:normal}.kw{color:var(--kw)}.ty{color:var(--ty)}.st{color:var(--st)}.nu{color:var(--nu)}.cm{color:var(--cm)}
.opts{direction:ltr}
.o{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:10px 12px;background:var(--p2);border:1.5px solid var(--ln);border-radius:9px;font:14px/1.5 var(--mono)}
.o kbd{flex:none;font:700 11px var(--mono);color:var(--c);border:1px solid var(--ln);border-radius:4px;min-width:22px;text-align:center;background:var(--p)}
.o span{min-width:0;overflow-wrap:anywhere}
.o:hover:not(:disabled){border-color:var(--c)}
.o:disabled{cursor:default;color:inherit}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--p2))}.o.ok::after{content:"✓";margin-inline-start:auto;color:var(--ok)}
.o.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--p2))}.o.no::after{content:"✗";margin-inline-start:auto;color:var(--no)}
.o.no span{text-decoration:underline wavy var(--no);text-underline-offset:4px}
.fb{margin-top:12px;border:1px solid var(--ln);border-inline-start:4px solid var(--ok);border-radius:9px;padding:8px 12px;background:var(--code)}
.fb.r{border-inline-start-color:var(--no)}
.fh{font:700 13px var(--mono);color:var(--ok)}.fb.r .fh{color:var(--no)}
.fb p{margin:6px 0 2px}
code{direction:ltr;unicode-bidi:isolate;font:13px var(--mono);color:var(--st);background:var(--p2);border:1px solid var(--ln);border-radius:4px;padding:0 5px}
.nav{display:flex;justify-content:space-between;gap:10px;direction:ltr}
.pb,.nav button{background:var(--ac);color:var(--bg);border:0;border-radius:7px;padding:8px 20px;font:700 14px var(--mono)}
.nav button:first-child{background:none;border:1px solid var(--ln);color:var(--ink)}
.nav button:disabled{opacity:.35;cursor:default}
.sec{margin:26px 0 10px;font:700 14px var(--mono);color:var(--c);direction:ltr}.sec::before{content:"// ";opacity:.7}
.rw{display:grid;grid-template-columns:130px 1fr 54px;gap:10px;align-items:center;margin:8px 0;font:600 13px var(--mono);direction:ltr}
.rw span{color:var(--c)}.rw b{text-align:right}
.bar{height:8px;background:var(--ln);border-radius:4px}.bar u{display:block;height:100%;background:var(--c);border-radius:4px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;direction:ltr}
.acts .pb+.pb{background:none;border:1px solid var(--ln);color:var(--ink)}
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:18px;justify-content:center;align-items:center;padding:7px 12px calc(7px + env(safe-area-inset-bottom,0px));background:var(--sb);color:#fff;font:600 12px var(--mono);direction:ltr}
.sbar u{position:absolute;left:0;top:0;height:3px;background:#fff;opacity:.85}
.sub{color:var(--mut);font-size:13px;margin:10px 0 0}
</style>
</head>

const D=[{"l":1,"t":"What is the main role of an operating system?","x":"","o":["Control hardware usage","Create programming languages","Design algorithmic steps","Draw graphical symbols"],"ar":"الـ OS بيتحكم في الـ Hardware وينسق استخدامه بين البرامج.","en":"The OS controls the hardware and coordinates its use among programs.","k":"","st":0},{"l":1,"t":"What is the main role of application programs?","x":"","o":["Define resource usage","Control computer hardware","Connect shared memory","Translate source code"],"ar":"الـ Application بتحدد إزاي الموارد تتستخدم لحل مشكلة المستخدم. التحكم في الـ Hardware شغل الـ OS.","en":"Applications define how resources are used to solve user problems. Controlling the hardware is the OS job.","k":"","st":0},{"l":1,"t":"A ____ is a collection of instructions to perform a specific task.","x":"Q6","o":["Program","Hardware","Data","CPU"],"ar":"Program = مجموعة تعليمات لتنفيذ مهمة معينة.","en":"A program is a collection of instructions.","k":"","st":0},{"l":1,"t":"What converts source code into an executable program?","x":"","o":["Compiler","Browser","Processor","Operating system"],"ar":"الـ Compiler بيحول الـ source code لبرنامج تنفيذي (executable).","en":"The compiler converts source code into an executable program.","k":"","st":0},{"l":1,"t":"Python source code is executed directly by a(n):","x":"","o":["Interpreter","Compiler","Linker","Flowchart"],"ar":"Interpreter (Python) بينفذ الكود مباشرة، وCompiler (C++) بيحوله لبرنامج تنفيذي.","en":"An interpreter (Python) runs code directly; a compiler (C++) converts it into an executable.","k":"","st":0},{"l":1,"t":"What is structured programming also known as?","x":"","o":["Modular programming","Linear programming","Hardware programming","Visual programming"],"ar":"الـ Structured programming اسمه كمان Modular لأنه بيقسم الكود لـ modules.","en":"Structured programming is also called modular programming because the code is split into modules.","k":"","st":0},{"l":1,"t":"How is unstructured programming organized?","x":"","o":["One single block","Several separate modules","Multiple independent functions","Different reusable components"],"ar":"الـ Unstructured الكود كله في block واحد.","en":"Unstructured programs are written as one single block of code.","k":"","st":0},{"l":1,"t":"An ____ is a set of steps used to complete a specific task.","x":"Q8","o":["algorithm","inter-compiler","interpreter","assembler"],"ar":"الـ Algorithm = مجموعة خطوات محددة لإنجاز مهمة.","en":"An algorithm is a set of specific steps to complete a task.","k":"","st":0},{"l":1,"t":"Which flowchart symbol represents a decision?","x":"","o":["Diamond","Rectangle","Terminator","Arrow"],"ar":"المعين (Diamond) = قرار أو تفرع yes/no.","en":"The diamond represents a decision (yes / no branching).","k":"","st":0},{"l":1,"t":"In flowcharts, ____ is represented by a rectangle box.","x":"Q7","o":["a process","a decision","an input","an output"],"ar":"المستطيل = عملية (process)، المعين = قرار، ومتوازي الأضلاع = إدخال/إخراج.","en":"Rectangle = process, diamond = decision, parallelogram = input/output.","k":"","st":0},{"l":1,"t":"What does IDE stand for?","x":"","o":["Integrated Development Environment","Internal Development Engine","Integrated Design Environment","Internal Design Engine"],"ar":"IDE = Integrated Development Environment، بيئة بتساعدك تكتب الكود وتعمل compile.","en":"IDE = Integrated Development Environment; it helps you write and compile code.","k":"","st":0},{"l":1,"t":"The C# compiler compiles C# code into:","x":"","o":["Common Intermediate Language (CIL)","Machine code directly","Pseudocode","A flowchart"],"ar":"والـ CIL بيحتاج .NET Framework عشان يشتغل.","en":"CIL then needs the .NET Framework to run.","k":"","st":0},{"l":2,"t":"Which is the correct hierarchy (outer to inner) of a C# program?","x":"","o":["namespace > class > method > statement","class > namespace > method > statement","method > class > namespace > statement","namespace > method > class > statement"],"ar":"الترتيب من الأكبر للأصغر: namespace ثم class ثم method ثم statement.","en":"Outer to inner: namespace, then class, then method, then statement.","k":"","st":0},{"l":2,"t":"Console is a ____","x":"","o":["Class","Method","Namespace"],"ar":"Console = Class جوه الـ namespace اسمه System.","en":"Console is a class inside the System namespace.","k":"using System;\n\nnamespace Section1\n{\n    class Program\n    {\n        static void Main(string[] args)\n        {\n            Console.WriteLine(\"***\");\n            Console.Write(\"***\");\n\n            Console.ReadKey();\n        }\n    }\n}","st":0},{"l":2,"t":"________ which is the entry point for all C# programs. All programs must have that method.","x":"","o":["Main()","HelloWorld()","Program","None"],"ar":"الـ Main() هي نقطة البداية لأي برنامج C# ولازم تكون موجودة.","en":"Main() is the entry point of every C# program and must exist.","k":"","st":0},{"l":2,"t":"The ____ method outputs data to the screen followed by a new line character.","x":"Q11","o":["Console.WriteLine","Console.Write","Console.Writelines","System.WriteLine"],"ar":"الـ WriteLine بتطبع وتضيف سطر جديد، أما Write فلا.","en":"WriteLine prints and then adds a new line; Write does not.","k":"","st":0},{"l":2,"t":"A single line comment starts with ____","x":"Q1","o":["//","%","#","\\\\"],"ar":"التعليق السطر الواحد بيبدأ بـ //، ومتعدد الأسطر بـ /* */.","en":"Single-line comment = //, multi-line = /* */.","k":"","st":0},{"l":2,"t":"Which comment style can span multiple lines?","x":"","o":["/* ... */","// ...","# ...","\u003c!-- ... -->"],"ar":"التعليق /* ... */ ممكن ياخد أكتر من سطر، و// لسطر واحد بس.","en":"/* ... */ can span many lines; // is for a single line only.","k":"","st":0},{"l":2,"t":"Which call compiles correctly in C#?","x":"","o":["Console.Write(\"A\");","console.write(\"A\");","Console.write(\"A\");","CONSOLE.WRITE(\"A\");"],"ar":"C# case-sensitive: Write غير write.","en":"C# is case-sensitive: Write is not write.","k":"","st":0},{"l":2,"t":"____ is an invalid variable name in C#.","x":"Q17","o":["1stVar","FirstVariable","first_variable","First11"],"ar":"الاسم مينفعش يبدأ برقم.","en":"A name cannot start with a digit.","k":"","st":0},{"l":2,"t":"What is the output of the following code?","x":"","o":["Error","x","x = x","none of the mentioned"],"ar":"المتغير x معملهوش قيمة (unassigned) فمينفعش يتستخدم.","en":"x was never assigned a value (unassigned variable), so it cannot be used.","k":"int x;\n\nConsole.WriteLine(\"x = \" + x);","st":0},{"l":2,"t":"What is the output of the following code?","x":"","o":["Error","3.14","PI = 3.14","none of the mentioned"],"ar":"الـ const لازم تديله قيمة وقت التعريف: A const field requires a value to be provided.","en":"A const must be given a value at definition: A const field requires a value to be provided.","k":"const float PI;\n\nPI = 3.14f;\n\nConsole.WriteLine(PI);","st":0},{"l":2,"t":"What is the output of the following code?","x":"","o":["Error","3.14","3.144","none of the mentioned"],"ar":"مينفعش تغير قيمة const بعد تعريفها.","en":"A const value cannot be changed after definition.","k":"const float PI = 3.14f;\n\nPI = 3.144;\n\nConsole.WriteLine(PI);","st":0},{"l":2,"t":"Error in line 2 is because","x":"","o":["Both a and b","a. The value must be identified as float by f suffix","b. Value represents double-precision number","c. The value is too large"],"ar":"5.2 قيمة double، لازم تكتبها 5.2f عشان تبقى float.","en":"5.2 is a double literal; write 5.2f to make it a float.","k":"uint x = -5;\nfloat xy = 5.2;\nbyte xyx = 150000;\nbool xyc = True;\nint aa = 5.5;","st":0},{"l":2,"t":"What is the range of sbyte?","x":"","o":["-128 to 127","0 to 255","-256 to 255","0 to 127"],"ar":"8 bits = 256 قيمة؛ نصفهم سالب في sbyte، وكلهم موجب في byte (0 - 255).","en":"8 bits = 256 values; sbyte splits them into negative and positive, byte is all positive (0 to 255).","k":"","st":0},{"l":2,"t":"How many bits does an int occupy?","x":"","o":["32 bits","8 bits","16 bits","64 bits"],
